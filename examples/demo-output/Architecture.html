/* Programmer Workflow · shared design system
   Offline, theme-aware, print-friendly. All class names are prefixed wc-. */
:root {
  color-scheme: dark;
  --wc-bg: #080d19;
  --wc-bg-2: #0d1526;
  --wc-bg-3: #111c33;
  --wc-panel: rgba(255, 255, 255, 0.038);
  --wc-panel-2: rgba(255, 255, 255, 0.068);
  --wc-panel-solid: #101a2e;
  --wc-text: #e9eefb;
  --wc-muted: #a0aec7;
  --wc-dim: #71819e;
  --wc-border: rgba(148, 163, 184, 0.16);
  --wc-border-strong: rgba(148, 163, 184, 0.3);
  --wc-accent: #8aa4ff;
  --wc-accent-2: #6ee7b7;
  --wc-accent-3: #c4b5fd;
  --wc-ok: #34d399;
  --wc-warn: #fbbf24;
  --wc-danger: #fb7185;
  --wc-info: #60a5fa;
  --wc-radius: 16px;
  --wc-radius-sm: 10px;
  --wc-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
  --wc-shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.22);
  --wc-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --wc-sans: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}

[data-theme="light"] {
  color-scheme: light;
  --wc-bg: #f4f6fb;
  --wc-bg-2: #eef1f8;
  --wc-bg-3: #e8edf7;
  --wc-panel: rgba(255, 255, 255, 0.82);
  --wc-panel-2: #ffffff;
  --wc-panel-solid: #ffffff;
  --wc-text: #111827;
  --wc-muted: #556078;
  --wc-dim: #77829a;
  --wc-border: rgba(17, 24, 39, 0.1);
  --wc-border-strong: rgba(17, 24, 39, 0.2);
  --wc-accent: #4f6bed;
  --wc-accent-2: #059669;
  --wc-accent-3: #7c3aed;
  --wc-ok: #059669;
  --wc-warn: #b45309;
  --wc-danger: #dc2626;
  --wc-info: #2563eb;
  --wc-shadow: 0 24px 70px rgba(30, 41, 59, 0.12);
  --wc-shadow-soft: 0 10px 30px rgba(30, 41, 59, 0.08);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--wc-sans);
  font-size: 15px;
  line-height: 1.62;
  color: var(--wc-text);
  background:
    radial-gradient(1100px 620px at 8% -10%, rgba(138, 164, 255, 0.16), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(110, 231, 183, 0.1), transparent 55%),
    linear-gradient(180deg, var(--wc-bg) 0%, var(--wc-bg-2) 52%, var(--wc-bg) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(138, 164, 255, 0.32); }
a { color: var(--wc-accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
code, pre, kbd { font-family: var(--wc-mono); }
code {
  padding: 0.12em 0.38em;
  border: 1px solid var(--wc-border);
  border-radius: 6px;
  background: var(--wc-panel);
  font-size: 0.86em;
  word-break: break-word;
}
pre {
  margin: 0;
  padding: 14px 16px;
  overflow: auto;
  border: 1px solid var(--wc-border);
  border-radius: var(--wc-radius-sm);
  background: rgba(2, 6, 23, 0.5);
  font-size: 12.5px;
  line-height: 1.55;
}
[data-theme="light"] pre { background: #0f172a; color: #e2e8f0; }
hr { border: 0; border-top: 1px solid var(--wc-border); margin: 22px 0; }

.wc-shell { width: min(1480px, 100%); margin: 0 auto; padding: 0 28px 110px; }
.wc-top {
  position: sticky;
  top: 0;
  z-index: 30;
  margin: 0 -28px;
  padding: 14px 28px 10px;
  background: color-mix(in srgb, var(--wc-bg) 82%, transparent);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid transparent;
}
.wc-top.scrolled { border-bottom-color: var(--wc-border); box-shadow: 0 12px 34px rgba(0, 0, 0, 0.18); }
.wc-topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.wc-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.wc-logo {
  width: 40px; height: 40px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 12px;
  border: 1px solid var(--wc-border-strong);
  background: linear-gradient(145deg, rgba(138, 164, 255, 0.24), rgba(110, 231, 183, 0.12));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.wc-logo svg { width: 23px; height: 23px; }
.wc-brand h1 { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: -0.01em; }
.wc-brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--wc-muted); }
.wc-top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.wc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 7px 13px;
  border: 1px solid var(--wc-border);
  border-radius: 10px;
  background: var(--wc-panel);
  color: var(--wc-text);
  font-size: 13px; font-weight: 550;
  white-space: nowrap;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.wc-btn:hover { background: var(--wc-panel-2); border-color: var(--wc-border-strong); text-decoration: none; }
.wc-btn:active { transform: translateY(1px); }
.wc-btn:focus-visible, .wc-tab:focus-visible, .wc-input:focus-visible, .wc-textarea:focus-visible, .wc-select:focus-visible {
  outline: 2px solid var(--wc-accent);
  outline-offset: 2px;
}
.wc-btn.primary {
  border-color: rgba(138, 164, 255, 0.55);
  background: linear-gradient(145deg, rgba(138, 164, 255, 0.3), rgba(138, 164, 255, 0.16));
  color: var(--wc-text);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
[data-theme="light"] .wc-btn.primary { color: #1e2a78; }
.wc-btn.ok { border-color: rgba(52, 211, 153, 0.45); background: rgba(52, 211, 153, 0.13); }
.wc-btn.warn { border-color: rgba(251, 191, 36, 0.42); background: rgba(251, 191, 36, 0.11); }
.wc-btn.danger { border-color: rgba(251, 113, 133, 0.42); background: rgba(251, 113, 133, 0.1); }
.wc-btn.ghost { background: transparent; }
.wc-btn.small { min-height: 30px; padding: 4px 9px; font-size: 12px; border-radius: 8px; }
.wc-btn.icon { width: 36px; padding: 0; }

.wc-icon { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 8px; }
.wc-kpi {
  padding: 14px 16px;
  border: 1px solid var(--wc-border);
  border-radius: 14px;
  background: var(--wc-panel);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
.wc-kpi .n { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.wc-kpi .l { margin-top: 4px; color: var(--wc-muted); font-size: 12.5px; }
.wc-kpi .h { margin-top: 2px; color: var(--wc-dim); font-size: 11.5px; }

.wc-tabs {
  display: flex; gap: 4px; overflow-x: auto;
  margin: 18px 0 22px; padding: 5px;
  border: 1px solid var(--wc-border);
  border-radius: 13px;
  background: var(--wc-panel);
  scrollbar-width: thin;
}
.wc-tab {
  flex: 0 0 auto;
  padding: 8px 14px;
  border: 0; border-radius: 9px;
  background: transparent; color: var(--wc-muted);
  font-size: 13.5px; font-weight: 560;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}
.wc-tab:hover { color: var(--wc-text); background: var(--wc-panel-2); }
.wc-tab.active { color: var(--wc-text); background: var(--wc-panel-2); box-shadow: var(--wc-shadow-soft); }
.wc-tab .count { margin-left: 6px; color: var(--wc-dim); font-size: 11.5px; }

.wc-section { margin: 0 0 28px; scroll-margin-top: 150px; }
.wc-section-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 13px; }
.wc-section-head h2 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
.wc-section-head p { margin: 0; color: var(--wc-muted); font-size: 13px; max-width: 820px; }
.wc-section-head .wc-btn { margin-left: auto; }
.wc-grid { display: grid; gap: 14px; }
.wc-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.wc-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.wc-grid.auto { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.wc-grid.auto-sm { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.wc-card {
  position: relative;
  padding: 17px 18px;
  border: 1px solid var(--wc-border);
  border-radius: var(--wc-radius);
  background: linear-gradient(160deg, var(--wc-panel-2), var(--wc-panel));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
.wc-card.clickable { cursor: pointer; }
.wc-card.clickable:hover { transform: translateY(-2px); border-color: var(--wc-border-strong); box-shadow: var(--wc-shadow-soft); }
.wc-card h3 { margin: 0; font-size: 15.5px; line-height: 1.35; letter-spacing: -0.01em; }
.wc-card p { margin: 7px 0 0; color: var(--wc-muted); font-size: 13px; }
.wc-card .wc-meta { margin-top: 10px; }
.wc-card-head { display: flex; align-items: flex-start; gap: 9px; justify-content: space-between; }
.wc-card-head .wc-card-title { min-width: 0; }
.wc-card-head .wc-card-title h3 { overflow-wrap: anywhere; }

.wc-badge, .wc-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border: 1px solid var(--wc-border);
  border-radius: 999px;
  background: var(--wc-panel);
  color: var(--wc-muted);
  font-size: 11.5px; font-weight: 600;
  line-height: 1.6;
  white-space: nowrap;
}
.wc-badge.ok, .wc-chip.ok { color: var(--wc-ok); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
.wc-badge.warn, .wc-chip.warn { color: var(--wc-warn); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
.wc-badge.danger, .wc-chip.danger { color: var(--wc-danger); border-color: rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.1); }
.wc-badge.info, .wc-chip.info { color: var(--wc-info); border-color: rgba(96, 165, 250, 0.35); background: rgba(96, 165, 250, 0.1); }
.wc-badge.violet, .wc-chip.violet { color: var(--wc-accent-3); border-color: rgba(196, 181, 253, 0.35); background: rgba(196, 181, 253, 0.1); }
.wc-chip.clickable { cursor: pointer; }
.wc-chip.clickable:hover { border-color: var(--wc-border-strong); color: var(--wc-text); }
.wc-chip.active { color: var(--wc-text); border-color: var(--wc-accent); background: rgba(138, 164, 255, 0.16); }

.wc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--wc-dim); font-size: 11.8px; }
.wc-meta .dot::before { content: "·"; margin-right: 8px; color: var(--wc-dim); }
.wc-path { font-family: var(--wc-mono); font-size: 11.8px; color: var(--wc-muted); overflow-wrap: anywhere; }
.wc-kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; }
.wc-kv dt { color: var(--wc-dim); font-size: 12.5px; }
.wc-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.wc-toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0 0 14px; }
.wc-search { position: relative; flex: 1 1 260px; max-width: 430px; }
.wc-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--wc-dim); }
.wc-input, .wc-textarea, .wc-select {
  width: 100%; min-height: 36px; padding: 8px 11px;
  border: 1px solid var(--wc-border); border-radius: 9px;
  background: var(--wc-panel); color: var(--wc-text);
  font-size: 13px;
}
.wc-search .wc-input { padding-left: 34px; }
.wc-input::placeholder, .wc-textarea::placeholder { color: var(--wc-dim); }
.wc-textarea { min-height: 84px; resize: vertical; line-height: 1.55; }
.wc-select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--wc-muted) 50%), linear-gradient(135deg, var(--wc-muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.wc-empty { padding: 34px 18px; text-align: center; color: var(--wc-muted); border: 1px dashed var(--wc-border); border-radius: var(--wc-radius); background: var(--wc-panel); }
.wc-empty strong { display: block; color: var(--wc-text); margin-bottom: 4px; }
.wc-note { padding: 11px 13px; border-left: 2px solid var(--wc-accent); background: var(--wc-panel); border-radius: 0 10px 10px 0; color: var(--wc-muted); font-size: 12.8px; }
.wc-warning { border-left-color: var(--wc-warn); }
.wc-danger-note { border-left-color: var(--wc-danger); }

.wc-table-wrap { overflow: auto; border: 1px solid var(--wc-border); border-radius: var(--wc-radius); background: var(--wc-panel); }
.wc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.wc-table th, .wc-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--wc-border); vertical-align: top; }
.wc-table th { position: sticky; top: 0; z-index: 1; background: var(--wc-panel-solid); color: var(--wc-muted); font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }
.wc-table tr:last-child td { border-bottom: 0; }
.wc-table tbody tr:hover { background: var(--wc-panel-2); }

.wc-timeline { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; }
.wc-timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: var(--wc-border-strong); }
.wc-step { position: relative; padding: 0 0 18px 0; }
.wc-step:last-child { padding-bottom: 0; }
.wc-step::before {
  content: attr(data-index);
  position: absolute; left: -26px; top: 1px;
  width: 15px; height: 15px;
  display: grid; place-items: center;
  border: 1px solid var(--wc-border-strong); border-radius: 50%;
  background: var(--wc-bg-2); color: var(--wc-muted);
  font-size: 9px; font-weight: 700;
}
.wc-step h4 { margin: 0; font-size: 13.8px; }
.wc-step p { margin: 3px 0 0; color: var(--wc-muted); font-size: 12.8px; }
.wc-step .wc-meta { margin-top: 4px; }

.wc-meter { height: 7px; border-radius: 999px; background: var(--wc-panel-2); overflow: hidden; }
.wc-meter > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--wc-accent), var(--wc-accent-2)); }

.wc-drawer-overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(2, 6, 23, 0.55);
  backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
}
.wc-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.wc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
  width: min(620px, 94vw);
  padding: 22px 24px 40px;
  overflow-y: auto;
  background: var(--wc-panel-solid);
  border-left: 1px solid var(--wc-border-strong);
  box-shadow: var(--wc-shadow);
  transform: translateX(102%);
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.wc-drawer.open { transform: translateX(0); }
.wc-drawer-head { display: flex; align-items: flex-start; gap: 12px; position: sticky; top: -22px; z-index: 2; margin: -22px -24px 18px; padding: 22px 24px 14px; background: color-mix(in srgb, var(--wc-panel-solid) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--wc-border); }
.wc-drawer-head h3 { margin: 0; font-size: 19px; line-height: 1.3; }
.wc-drawer-head .wc-btn { margin-left: auto; }
.wc-drawer h4 { margin: 22px 0 8px; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--wc-dim); }
.wc-drawer p { color: var(--wc-muted); }
.wc-drawer ul { margin: 6px 0; padding-left: 20px; color: var(--wc-muted); }
.wc-drawer li { margin: 4px 0; }

.wc-modal-wrap { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; padding: 20px; background: rgba(2, 6, 23, 0.6); backdrop-filter: blur(4px); }
.wc-modal-wrap.open { display: grid; }
.wc-modal { width: min(560px, 100%); max-height: 88vh; overflow: auto; padding: 22px; border: 1px solid var(--wc-border-strong); border-radius: 18px; background: var(--wc-panel-solid); box-shadow: var(--wc-shadow); }
.wc-modal h3 { margin: 0 0 6px; font-size: 18px; }
.wc-modal p { margin: 0 0 14px; color: var(--wc-muted); font-size: 13px; }
.wc-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.wc-toast {
  position: fixed; left: 50%; bottom: 92px; z-index: 90;
  transform: translate(-50%, 12px);
  padding: 9px 15px;
  border: 1px solid var(--wc-border-strong); border-radius: 999px;
  background: var(--wc-panel-solid); color: var(--wc-text);
  box-shadow: var(--wc-shadow-soft); font-size: 12.8px;
  opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease;
}
.wc-toast.show { opacity: 1; transform: translate(-50%, 0); }

.wc-reviewbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--wc-bg) 88%, transparent);
  backdrop-filter: blur(18px) saturate(140%);
  border-top: 1px solid var(--wc-border-strong);
}
.wc-reviewbar-inner { width: min(1480px, 100%); margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wc-reviewbar .status { color: var(--wc-muted); font-size: 12.5px; }
.wc-reviewbar .status strong { color: var(--wc-text); }
.wc-reviewbar .spacer { flex: 1; }
.wc-reviewbar .wc-btn { min-height: 34px; }

.wc-copy { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--wc-accent); padding: 0; font-size: 12px; }
.wc-copy:hover { text-decoration: underline; }

.wc-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.wc-hide { display: none !important; }
.wc-nowrap { white-space: nowrap; }
.wc-right { margin-left: auto; }
.wc-mt { margin-top: 14px; }
.wc-mb { margin-bottom: 14px; }
.wc-center { text-align: center; }
.wc-muted { color: var(--wc-muted); }
.wc-dim { color: var(--wc-dim); }
.wc-small { font-size: 12px; }
.wc-strong { font-weight: 650; }
.wc-break { overflow-wrap: anywhere; }

@media (max-width: 980px) {
  .wc-shell { padding: 0 18px 120px; }
  .wc-top { margin: 0 -18px; padding: 12px 18px 8px; }
  .wc-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wc-reviewbar .status { display: none; }
}
@media (max-width: 680px) {
  body { font-size: 14px; }
  .wc-shell { padding: 0 14px 140px; }
  .wc-top { margin: 0 -14px; padding: 10px 14px 6px; }
  .wc-brand h1 { font-size: 15px; }
  .wc-brand p { display: none; }
  .wc-grid.cols-2, .wc-grid.cols-3 { grid-template-columns: 1fr; }
  .wc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wc-kpi .n { font-size: 23px; }
  .wc-tabs { margin: 12px 0 18px; }
  .wc-drawer { width: 100%; border-left: 0; }
  .wc-kv { grid-template-columns: 92px minmax(0, 1fr); }
  .wc-reviewbar-inner { gap: 6px; }
  .wc-reviewbar .wc-btn { flex: 1 1 auto; padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
}
@media print {
  :root { color-scheme: light; }
  body { background: #fff !important; color: #111827; font-size: 11pt; }

  <script>
/* Programmer Workflow · shared review + UI helpers (no dependencies) */
(function () {
  "use strict";
  const WC = (window.WC = window.WC || {});

  WC.escape = function (value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  WC.byId = function (id) { return document.getElementById(id); };
  WC.el = function (tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        const value = attrs[key];
        if (value == null || value === false) return;
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else if (key === "html") node.innerHTML = value;
        else if (key === "dataset") Object.keys(value).forEach(function (k) { node.dataset[k] = value[k]; });
        else if (key.indexOf("on") === 0 && typeof value === "function") node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value === true ? "" : value);
      });
    }
    (children || []).forEach(function (child) {
      if (child == null) return;
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  };
  WC.formatDate = function (iso) {
    if (!iso) return "—";
    try {
      return new Date(iso).toLocaleString("zh-CN", { hour12: false });
    } catch (err) { return String(iso); }
  };
  WC.copy = async function (text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      WC.toast("已复制到剪贴板");
      return true;
    } catch (err) {
      WC.toast("复制失败，请手动选择文本");
      return false;
    }
  };
  WC.download = function (filename, text, mime) {
    const blob = new Blob([text], { type: mime || "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  };
  let toastTimer = null;
  WC.toast = function (message) {
    const node = WC.byId("wc-toast");
    if (!node) return;
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove("show"); }, 2200);
  };
  WC.storage = {
    get: function (key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (err) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (err) { return false; }
    },
    remove: function (key) { try { localStorage.removeItem(key); } catch (err) {} }
  };

  /* ---- modal ---------------------------------------------------------- */
  let modalCleanup = null;
  WC.modal = function (options) {
    const wrap = WC.byId("wc-modal");
    const title = WC.byId("wc-modal-title");
    const desc = WC.byId("wc-modal-desc");
    const body = WC.byId("wc-modal-body");
    const actions = WC.byId("wc-modal-actions");
    if (!wrap) return;
    title.textContent = options.title || "";
    desc.textContent = options.description || "";
    desc.classList.toggle("wc-hide", !options.description);
    body.innerHTML = "";
    if (options.body) body.appendChild(options.body);
    actions.innerHTML = "";
    (options.actions || [{ label: "关闭" }]).forEach(function (action) {
      const button = WC.el("button", {
        class: "wc-btn small " + (action.className || ""),
        text: action.label || "确定",
        onclick: function () {
          if (action.onClick) {
            const result = action.onClick();
            if (result === false) return;
          }
          WC.closeModal();
        }
      });
      actions.appendChild(button);
    });
    wrap.classList.add("open");
    document.body.style.overflow = "hidden";
    const first = body.querySelector("input, textarea, select, button");
    if (first) setTimeout(function () { first.focus(); }, 30);
    modalCleanup = function (event) {
      if (event && event.key && event.key !== "Escape") return;
      WC.closeModal();
    };
    document.addEventListener("keydown", modalCleanup);
    wrap.onclick = function (event) { if (event.target === wrap) WC.closeModal(); };
  };
  WC.closeModal = function () {
    const wrap = WC.byId("wc-modal");
    if (!wrap) return;
    wrap.classList.remove("open");
    document.body.style.overflow = "";
    if (modalCleanup) { document.removeEventListener("keydown", modalCleanup); modalCleanup = null; }
  };

  /* ---- copy hooks ----------------------------------------------------- */
  WC.bindCopy = function (root) {
    (root || document).querySelectorAll("[data-copy]").forEach(function (node) {
      if (node.__wcCopy) return;
      node.__wcCopy = true;
      node.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        WC.copy(node.getAttribute("data-copy"));
      });
    });
  };

  /* ---- theme ---------------------------------------------------------- */
  WC.applyTheme = function (theme) {
    document.documentElement.setAttribute("data-theme", theme);
    WC.storage.set("wc-theme", theme);
  };
  WC.initTheme = function () {
    const saved = WC.storage.get("wc-theme", null);
    const preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    WC.applyTheme(saved || preferred);
    const button = WC.byId("wc-theme");
    if (button) button.addEventListener("click", function () {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      WC.applyTheme(next);
      WC.toast(next === "dark" ? "已切换深色主题" : "已切换浅色主题");
    });
  };

  /* ---- review controller --------------------------------------------- */
  function Review(options) {
    this.kind = options.kind || "doc";
    this.title = options.title || document.title;
    this.specHash = options.specHash || "";
    this.sections = options.sections || [];
    this.storageKey = "wc-review:" + this.kind + ":" + this.specHash;
    const saved = WC.storage.get(this.storageKey, null);
    this.state = saved && typeof saved === "object" ? saved : {
      decision: "pending", sections: {}, notes: [], pins: [], updated_at: null
    };
    this.state.notes = Array.isArray(this.state.notes) ? this.state.notes : [];
    this.state.pins = Array.isArray(this.state.pins) ? this.state.pins : [];
    this.onChange = null;
  }
  Review.prototype.save = function () {
    this.state.updated_at = new Date().toISOString();
    const ok = WC.storage.set(this.storageKey, this.state);
    if (!ok) WC.toast("浏览器禁用了本地存储，评审只保留在当前页面");
    this.renderStatus();
    if (this.onChange) this.onChange(this.state);
  };
  Review.prototype.decisionLabel = function () {
    return this.state.decision === "approved" ? "已通过"
      : this.state.decision === "changes_requested" ? "请求修改" : "未提交";
  };
  Review.prototype.renderStatus = function () {
    const node = WC.byId("wc-review-status");
    if (!node) return;
    node.innerHTML = "评审：<strong>" + WC.escape(this.decisionLabel()) + "</strong>";
    if (this.state.notes.length) node.innerHTML += " · " + this.state.notes.length + " 条意见";
    if (this.state.pins.length) node.innerHTML += " · " + this.state.pins.length + " 个标注";
    node.title = "点击查看评审意见";
    node.style.cursor = "pointer";
    node.onclick = this.showNotes.bind(this);
  };

  };

  };
  Review.prototype.showNotes = function () {
    const self = this;
    const body = WC.el("div");
    if (!this.state.notes.length && !this.state.pins.length) {

    } else {
      this.state.notes.forEach(function (note, index) {
        const card = WC.el("div", { class: "wc-card", style: "margin-bottom:10px" }, [
          WC.el("div", { class: "wc-card-head" }, [
            WC.el("strong", { text: (index + 1) + ". " + (note.target || "整体") }),
            WC.el("span", { class: "wc-badge " + (note.severity === "blocking" ? "danger" : note.severity === "question" ? "info" : "warn"), text: note.severity === "blocking" ? "必须修改" : note.severity === "question" ? "疑问" : "建议" })

          })])
        ]);
        body.appendChild(card);
      });
      if (this.state.pins.length) {
        const list = WC.el("div", {}, [WC.el("h4", { text: "画布标注" })]);
        this.state.pins.forEach(function (pin, index) {
          list.appendChild(WC.el("div", { class: "wc-note", style: "margin-bottom:8px" }, [
            WC.el("strong", { text: "#" + (index + 1) + " " + (pin.direction || "") + " / " + (pin.screen || "") }),

        });

      }
    }

  };
  Review.prototype.noteModal = function (severity) {
    const self = this;
    const form = WC.el("div");
    const targetLabel = WC.el("label", { class: "wc-small wc-muted", text: "针对哪一部分" });
    const select = WC.el("select", { class: "wc-select" });
    (self.sections.length ? self.sections : [{ id: "overall", label: "整体" }]).forEach(function (section) {
      select.appendChild(WC.el("option", { value: section.id, text: section.label }));
    });
    const textLabel = WC.el("label", { class: "wc-small wc-muted", text: "意见", style: "display:block;margin-top:12px" });
    const textarea = WC.el("textarea", { class: "wc-textarea", placeholder: "具体哪里需要改？期望是什么？", rows: "5" });
    const severityLabel = WC.el("label", { class: "wc-small wc-muted", text: "类型", style: "display:block;margin-top:12px" });
    const severitySelect = WC.el("select", { class: "wc-select" });
    [["blocking", "必须修改"], ["suggestion", "建议"], ["question", "疑问"]].forEach(function (item) {
      severitySelect.appendChild(WC.el("option", { value: item[0], text: item[1] }));
    });
    severitySelect.value = severity || "suggestion";
    form.appendChild(targetLabel); form.appendChild(select);
    form.appendChild(textLabel); form.appendChild(textarea);
    form.appendChild(severityLabel); form.appendChild(severitySelect);
    WC.modal({
      title: severity === "blocking" ? "请求修改" : "添加评审意见",
      description: "写清楚位置、现象和期望，Agent 才能直接修改。",
      body: form,
      actions: [
        { label: "取消" },
        {
          label: "保存意见", className: "primary",
          onClick: function () {
            const text = textarea.value.trim();
            if (!text) { WC.toast("请先写意见"); textarea.focus(); return false; }
            self.state.notes.push({
              id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now() + Math.random()),
              target: select.value, severity: severitySelect.value, text: text,
              created_at: new Date().toISOString()
            });
            if (severitySelect.value === "blocking") self.state.decision = "changes_requested";
            self.save();
            WC.toast("意见已保存");
          }
        }
      ]
    });
  };
  Review.prototype.removeNote = function (id) {
    this.state.notes = this.state.notes.filter(function (note) { return note.id !== id; });
    this.save();
  };
  Review.prototype.addPin = function (pin) {
    this.state.pins.push(Object.assign({
      id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now() + Math.random()),
      created_at: new Date().toISOString()
    }, pin));
    this.save();
  };
  Review.prototype.removePin = function (id) {
    this.state.pins = this.state.pins.filter(function (pin) { return pin.id !== id; });
    this.save();
  };
  Review.prototype.summaryMarkdown = function () {
    const lines = [
      "## " + this.title + " 评审",
      "",
      "- 结论：" + this.decisionLabel(),
      "- 文档标识：" + this.kind + " / " + this.specHash,
      "- 时间：" + new Date().toLocaleString("zh-CN", { hour12: false }),
      ""
    ];
    if (this.state.notes.length) {
      lines.push("### 意见");
      this.state.notes.forEach(function (note, index) {
        lines.push((index + 1) + ". [" + (note.severity || "suggestion") + "] " + (note.target || "整体") + "：" + note.text);
      });
      lines.push("");
    }
    if (this.state.pins.length) {
      lines.push("### 画布标注");
      this.state.pins.forEach(function (pin, index) {
        lines.push((index + 1) + ". " + (pin.direction || "") + " / " + (pin.screen || "") + "： " + (pin.note || ""));
      });
      lines.push("");
    }
    return lines.join("\n");
  };
  Review.prototype.export = function () {
    const payload = {
      schema: 1,
      generator: "programmer-workflow",
      kind: this.kind,
      title: this.title,
      spec_hash: this.specHash,
      decision: this.state.decision,
      sections: this.state.sections,
      notes: this.state.notes,
      pins: this.state.pins,
      reviewed_at: new Date().toISOString(),
      page_url: location.href,
      user_agent: navigator.userAgent
    };
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    WC.download("programmer-workflow-" + this.kind + "-review-" + stamp + ".json", JSON.stringify(payload, null, 2));
    WC.toast("评审 JSON 已下载；把它放回工作区或复制反馈给 Agent");
  };
  Review.prototype.bind = function () {
    const self = this;
    const approve = WC.byId("wc-review-approve");
    const changes = WC.byId("wc-review-changes");
    const note = WC.byId("wc-review-note");
    const exportButton = WC.byId("wc-review-export");
    if (approve) approve.addEventListener("click", function () { self.approve(); });
    if (changes) changes.addEventListener("click", function () { self.requestChanges(); });
    if (note) note.addEventListener("click", function () { self.noteModal("suggestion"); });
    if (exportButton) exportButton.addEventListener("click", function () { self.export(); });
    self.renderStatus();
  };
  WC.Review = Review;
  WC.copyMarkdown = function (text) { return WC.copy(text); };

  document.addEventListener("DOMContentLoaded", function () {
    WC.initTheme();
    const top = WC.byId("wc-top");
    if (top) {
      const onScroll = function () { top.classList.toggle("scrolled", window.scrollY > 8); };
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }
    const print = WC.byId("wc-print");
    if (print) print.addEventListener("click", function () { window.print(); });
  });
})();

  function layoutGraph() {
    const layers = DATA.layers.length ? DATA.layers : deriveLayers();
    const order = {};
    layers.forEach(function (layer, index) { order[layer.id] = index; });
    const groups = {};
    DATA.modules.forEach(function (m) {
      const key = m.layer || "未分层";
      if (order[key] == null) order[key] = Object.keys(order).length;
      (groups[key] = groups[key] || []).push(m);
    });
    const nodeW = 168, nodeH = 48, gapX = 235, gapY = 92;
    const nodes = [];
    Object.keys(groups).forEach(function (key) {
      const column = order[key];
      groups[key].forEach(function (m, row) {
        nodes.push({ m: m, x: 40 + column * gapX, y: 46 + row * gapY, w: nodeW, h: nodeH });
      });
    });
    const maxX = nodes.reduce(function (max, n) { return Math.max(max, n.x + n.w); }, 0);
    const maxY = nodes.reduce(function (max, n) { return Math.max(max, n.y + n.h); }, 0);
    const W = Math.max(900, maxX + 60);
    const H = Math.max(460, maxY + 70);
    const byId = {};
    nodes.forEach(function (n) { byId[n.m.id] = n; });
    const edges = [];
    nodes.forEach(function (n) {
      (n.m.depends_on || []).forEach(function (id) {
        if (byId[id]) edges.push({ from: n, to: byId[id], id: n.m.id + "__" + id });
      });
    });
    return { nodes: nodes, edges: edges, W: W, H: H, byId: byId };
  }

  function graphHTML() {
    const layout = layoutGraph();
    const nodeMarkup = layout.nodes.map(function (n) {
      const sub = n.m.layer || "";
      return '<g class="node" data-module="' + esc(n.m.id) + '" data-graph-node="' + esc(n.m.id) + '" transform="translate(' + n.x + ',' + n.y + ')" tabindex="0" role="button" aria-label="' + esc(n.m.name) + '">' +
        '<rect width="' + n.w + '" height="' + n.h + '" rx="10"></rect>' +
        '<text x="' + (n.w / 2) + '" y="20" text-anchor="middle">' + esc(n.m.name.length > 18 ? n.m.name.slice(0, 17) + "…" : n.m.name) + '</text>' +
        '<text class="sub" x="' + (n.w / 2) + '" y="35" text-anchor="middle">' + esc(sub.length > 22 ? sub.slice(0, 21) + "…" : sub) + '</text></g>';
    }).join("");
    const edgeMarkup = layout.edges.map(function (e) {
      const x1 = e.from.x + e.from.w, y1 = e.from.y + e.from.h / 2;
      const x2 = e.to.x, y2 = e.to.y + e.to.h / 2;
      const dx = Math.max(38, Math.abs(x2 - x1) * 0.45);
      return '<path class="edge" data-edge="' + esc(e.id) + '" data-from="' + esc(e.from.m.id) + '" data-to="' + esc(e.to.m.id) + '" d="M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2 + '"></path>';
    }).join("");
    return '<div class="graph-wrap" id="graph-wrap"><svg class="graph-svg" id="graph-svg" viewBox="0 0 ' + layout.W + ' ' + layout.H + '" role="img" aria-label="模块依赖图">' +
      '<defs><marker id="wc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="rgba(148,163,184,.55)"></path></marker></defs>' +
      '<g id="graph-viewport">' + edgeMarkup + nodeMarkup + '</g></svg>' +
      '<div class="graph-controls"><button class="wc-btn small icon ghost" data-zoom="in" title="放大">+</button><button class="wc-btn small icon ghost" data-zoom="out" title="缩小">−</button><button class="wc-btn small ghost" data-zoom="reset">重置</button></div>' +
      '<div class="graph-legend"><span><i style="background:var(--wc-accent)"></i>点击节点查看详情</span><span><i style="background:var(--wc-ok)"></i>箭头 = 依赖</span></div>' +
      '<div class="graph-hint">拖拽平移 · 滚轮缩放</div></div>';
  }

  /* ---------------------------------------------------------------- drawers */
  function drawer(title, subtitle, bodyHTML) {
    const node = WC.byId("wc-drawer");
    const overlay = WC.byId("wc-overlay");
    if (!node) return;
    node.innerHTML = '<div class="wc-drawer-head"><div><h3>' + esc(title) + '</h3>' +
      (subtitle ? '<div class="wc-meta" style="margin-top:4px">' + esc(subtitle) + '</div>' : "") +
      '</div><button class="wc-btn small icon ghost" data-close-drawer aria-label="关闭">✕</button></div>' + bodyHTML;
    node.classList.add("open");
    node.setAttribute("aria-hidden", "false");
    overlay.hidden = false;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    WC.bindCopy(node);
    node.querySelectorAll("[data-goto-module]").forEach(function (button) {
      button.addEventListener("click", function () { openModule(button.getAttribute("data-goto-module")); });
    });
    node.querySelectorAll("[data-goto-feature]").forEach(function (button) {
      button.addEventListener("click", function () { openFeature(button.getAttribute("data-goto-feature")); });
    });
  }
  function closeDrawer() {
    const node = WC.byId("wc-drawer");
    const overlay = WC.byId("wc-overlay");
    if (!node) return;
    node.classList.remove("open");
    node.setAttribute("aria-hidden", "true");
    overlay.classList.remove("open");
    overlay.hidden = true;
    document.body.style.overflow = "";
  }
  function openModule(id) {
    const m = DATA.modules.find(function (x) { return x.id === id; });
    if (!m) return;
    const deps = m.depends_on.map(function (dep) {
      const target = DATA.modules.find(function (x) { return x.id === dep; });
      return target ? '<button class="wc-chip clickable" data-goto-module="' + esc(target.id) + '">' + esc(target.name) + '</button>' : '<span class="wc-chip">' + esc(dep) + '</span>';
    }).join(" ");
    const usedBy = m.used_by.map(function (dep) {
      const target = DATA.modules.find(function (x) { return x.id === dep; });
      return target ? '<button class="wc-chip clickable" data-goto-module="' + esc(target.id) + '">' + esc(target.name) + '</button>' : "";
    }).join(" ");
    const body = '<p>' + esc(m.role || "未填写职责") + '</p>' +
      '<h4>职责</h4>' + (m.responsibilities.length ? '<ul>' + m.responsibilities.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join("") + '</ul>' : '<p class="wc-muted">未记录。</p>') +
      '<h4>位置</h4><p>' + copyPath(m.path) + '</p>' +
      (m.key_files.length ? '<h4>关键文件</h4><div class="wc-table-wrap"><table class="wc-table"><tbody>' + m.key_files.map(function (f) {
        return '<tr><td>' + copyPath(f.path) + '</td><td>' + esc(f.purpose || "") + '</td></tr>';
      }).join("") + '</tbody></table></div>' : "") +
      '<h4>依赖</h4><p>' + (deps || '<span class="wc-muted">无内部依赖</span>') + '</p>' +
      '<h4>被谁使用</h4><p>' + (usedBy || '<span class="wc-muted">无记录</span>') + '</p>' +
      '<h4>证据</h4>' + (m.evidence.length ? '<ul>' + m.evidence.map(function (e) { return '<li>' + copyPath(e) + '</li>'; }).join("") + '</ul>' : '<p class="wc-muted">未附证据。</p>') +
      (m.notes ? '<h4>备注</h4><p>' + esc(m.notes) + '</p>' : "") +
      '<div class="wc-meta" style="margin-top:18px">' + confidenceBadge(m.confidence) + '<span>模块 ' + esc(m.id) + '</span></div>';
    drawer(m.name, m.path, body);
  }
  function openFeature(id) {
    const f = DATA.features.find(function (x) { return x.id === id; });
    if (!f) return;
    const domain = (DATA.domains.find(function (d) { return d.id === f.domain; }) || {}).name || f.domain;
    const body = '<p>' + esc(f.summary || "未填写功能说明") + '</p>' +
      (f.user_value ? '<h4>用户价值</h4><p>' + esc(f.user_value) + '</p>' : "") +
      '<h4>状态</h4><p>' + badge(f.status === "implemented" ? "已实现" : f.status === "planned" ? "规划中" : "部分实现", f.status === "implemented" ? "ok" : f.status === "planned" ? "info" : "warn") +
      ' ' + confidenceBadge(f.confidence) + (f.priority ? ' ' + badge(f.priority) : "") + '</p>' +
      (f.entry_points.length ? '<h4>入口</h4><ul>' + f.entry_points.map(function (e) { return '<li>' + copyPath(e) + '</li>'; }).join("") + '</ul>' : "") +
      (f.user_flow.length ? '<h4>用户路径</h4><ol class="wc-timeline">' + f.user_flow.map(function (step, index) { return '<li class="wc-step" data-index="' + (index + 1) + '"><p>' + esc(step) + '</p></li>'; }).join("") + '</ol>' : "") +
      ((f.inputs.length || f.outputs.length) ? '<h4>输入 / 输出</h4><p><strong>输入：</strong>' + esc(f.inputs.join("、") || "—") + '<br><strong>输出：</strong>' + esc(f.outputs.join("、") || "—") + '</p>' : "") +
      (f.dependencies.length ? '<h4>依赖功能</h4><p>' + f.dependencies.map(function (dep) {
        const target = DATA.features.find(function (x) { return x.id === dep; });
        return target ? '<button class="wc-chip clickable" data-goto-feature="' + esc(target.id) + '">' + esc(target.name) + '</button>' : '<span class="wc-chip">' + esc(dep) + '</span>';
      }).join(" ") + '</p>' : "") +
      (f.tests.length ? '<h4>测试</h4><ul>' + f.tests.map(function (t) { return '<li>' + copyPath(t) + '</li>'; }).join("") + '</ul>' : '<h4>测试</h4><p class="wc-muted">未记录测试文件或验证步骤。</p>') +
      '<h4>证据</h4>' + (f.evidence.length ? '<ul>' + f.evidence.map(function (e) { return '<li>' + copyPath(e) + '</li>'; }).join("") + '</ul>' : '<p class="wc-muted">未附证据。</p>') +
      (f.notes ? '<h4>备注</h4><p>' + esc(f.notes) + '</p>' : "") +
      '<div class="wc-meta" style="margin-top:18px"><span>' + esc(domain || "未分组") + '</span><span>功能 ' + esc(f.id) + '</span></div>';
    drawer(f.name, domain || "", body);
  }

  /* ---------------------------------------------------------------- filters */
  function applyModuleFilter() {
    const grid = WC.byId("module-grid");
    if (!grid) return;
    const q = state.moduleQuery.trim().toLowerCase();
    let visible = 0;
    grid.querySelectorAll(".module-card").forEach(function (card) {
      const matchQ = !q || card.getAttribute("data-name").indexOf(q) >= 0;
      const matchL = state.layer === "all" || card.getAttribute("data-layer") === state.layer;
      const show = matchQ && matchL;
      card.classList.toggle("wc-hide", !show);
      if (show) visible += 1;
    });
    const count = WC.byId("module-visible-count");
    if (count) count.textContent = visible + " 个模块";
    const emptyNode = WC.byId("module-empty");
    if (emptyNode) emptyNode.classList.toggle("wc-hide", visible !== 0);
  }
  function applyFeatureFilter() {
    const grid = WC.byId("feature-grid");
    if (!grid) return;
    const q = state.featureQuery.trim().toLowerCase();
    let visible = 0;
    grid.querySelectorAll(".feature-card").forEach(function (card) {
      const matchQ = !q || card.getAttribute("data-name").indexOf(q) >= 0;
      const matchS = state.status === "all" || card.getAttribute("data-status") === state.status;
      const matchD = state.domain === "all" || card.getAttribute("data-domain") === state.domain;
      const show = matchQ && matchS && matchD;
      card.classList.toggle("wc-hide", !show);
      if (show) visible += 1;
    });
    const count = WC.byId("feature-count");
    if (count) count.textContent = visible + " 项功能";
    const emptyNode = WC.byId("feature-empty");
    if (emptyNode) emptyNode.classList.toggle("wc-hide", visible !== 0);
  }
  function applyFileFilter() {
    const body = WC.byId("file-body");
    if (!body) return;
    const q = state.fileQuery.trim().toLowerCase();
    let visible = 0;
    body.querySelectorAll("tr").forEach(function (row) {
      const show = !q || row.getAttribute("data-name").indexOf(q) >= 0;
      row.classList.toggle("wc-hide", !show);
      if (show) visible += 1;
    });
    const count = WC.byId("file-count");
    if (count) count.textContent = visible + " 个文件";
    const emptyNode = WC.byId("file-empty");
    if (emptyNode) emptyNode.classList.toggle("wc-hide", visible !== 0);
  }
  function applyDecisionFilter() {
    document.querySelectorAll("#decision-grid .decision-card").forEach(function (card) {
      card.classList.toggle("wc-hide", !!state.decisionQuery && card.getAttribute("data-name").indexOf(state.decisionQuery.toLowerCase()) < 0);
    });
  }

  /* ---------------------------------------------------------------- graph interactions */
  function bindGraph() {
    const svg = WC.byId("graph-svg");
    const wrap = WC.byId("graph-wrap");
    if (!svg || !wrap) return;
    const layout = layoutGraph();
    let view = { x: 0, y: 0, w: layout.W, h: layout.H };
    let drag = null;
    let lastMoved = false;
    function apply() { svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h); }
    function reset() { view = { x: 0, y: 0, w: layout.W, h: layout.H }; apply(); }
    function zoom(factor, cx, cy) {
      const nw = Math.max(layout.W * 0.25, Math.min(layout.W * 3, view.w * factor));
      const ratio = nw / view.w;
      const px = cx == null ? view.x + view.w / 2 : cx;
      const py = cy == null ? view.y + view.h / 2 : cy;
      view.x = px - (px - view.x) * ratio;
      view.y = py - (py - view.y) * ratio;
      view.w = nw;
      view.h = nw * (layout.H / layout.W);
      apply();
    }
    function worldPoint(event) {
      const rect = svg.getBoundingClientRect();
      return {
        x: view.x + ((event.clientX - rect.left) / rect.width) * view.w,
        y: view.y + ((event.clientY - rect.top) / rect.height) * view.h
      };
    }
    svg.addEventListener("wheel", function (event) {
      event.preventDefault();
      const p = worldPoint(event);
      zoom(event.deltaY > 0 ? 1.14 : 0.88, p.x, p.y);
    }, { passive: false });
    svg.addEventListener("pointerdown", function (event) {
      if (event.target.closest(".node")) return;
      drag = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y, moved: false };
      svg.classList.add("dragging");
      svg.setPointerCapture(event.pointerId);
    });
    svg.addEventListener("pointermove", function (event) {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      view.x = drag.vx - (dx / svg.getBoundingClientRect().width) * view.w;
      view.y = drag.vy - (dy / svg.getBoundingClientRect().height) * view.h;
      apply();
    });
    function endDrag() {
      if (!drag) return;
      lastMoved = drag.moved;
      drag = null;
      svg.classList.remove("dragging");
    }
    svg.addEventListener("pointerup", endDrag);
    svg.addEventListener("pointercancel", endDrag);
    svg.querySelectorAll("[data-graph-node]").forEach(function (node) {
      node.addEventListener("mouseenter", function () {
        const id = node.getAttribute("data-graph-node");
        svg.querySelectorAll(".node").forEach(function (n) {
          const nid = n.getAttribute("data-graph-node");
          n.classList.toggle("hot", nid === id);
          n.classList.toggle("dim", nid !== id && !connected(id, nid));
        });
        svg.querySelectorAll(".edge").forEach(function (edge) {
          const hot = edge.getAttribute("data-from") === id || edge.getAttribute("data-to") === id;
          edge.classList.toggle("hot", hot);
          edge.classList.toggle("dim", !hot);
        });
      });
      node.addEventListener("mouseleave", function () {
        svg.querySelectorAll(".node").forEach(function (n) { n.classList.remove("hot", "dim"); });
        svg.querySelectorAll(".edge").forEach(function (e) { e.classList.remove("hot", "dim"); });
      });
    });
    svg.addEventListener("click", function (event) {
      if (lastMoved) { lastMoved = false; return; }
      const node = event.target.closest("[data-graph-node]");
      if (node) openModule(node.getAttribute("data-graph-node"));
    });
    wrap.querySelectorAll("[data-zoom]").forEach(function (button) {
      button.addEventListener("click", function () {
        const action = button.getAttribute("data-zoom");
        if (action === "in") zoom(0.82);
        else if (action === "out") zoom(1.2);
        else reset();
      });
    });
    apply();
  }
  function connected(a, b) {
    return DATA.modules.some(function (m) {
      return (m.id === a && m.depends_on.indexOf(b) >= 0) || (m.id === b && m.depends_on.indexOf(a) >= 0);
    });
  }

  /* ---------------------------------------------------------------- render */
  function render() {
    let content = "";
    switch (state.tab) {
      case "modules": content = modulesTab(); break;
      case "flows": content = flowsTab(); break;
      case "decisions": content = decisionsTab(); break;
      case "risks": content = risksTab(); break;
      case "files": content = filesTab(); break;
      case "features": content = featuresTab(); break;
      case "matrix": content = matrixTab(); break;
      case "journeys": content = journeysTab(); break;
      case "questions": content = questionsTab(); break;
      case "glossary": content = glossaryTab(); break;
      default: content = overview();
    }
    app.innerHTML = hero() + kpis() + tabbar() + content;
    WC.bindCopy(app);
    if (state.tab === "modules") {
      const search = WC.byId("module-search");
      if (search) {
        search.addEventListener("input", function () { state.moduleQuery = search.value; applyModuleFilter(); });
        applyModuleFilter();
      }
      if (state.graph) bindGraph();
    }
    if (state.tab === "features") {
      const search = WC.byId("feature-search");
      if (search) {
        search.addEventListener("input", function () { state.featureQuery = search.value; applyFeatureFilter(); });
      }
      const select = WC.byId("feature-domain");
      if (select) {
        select.value = state.domain;
        select.addEventListener("change", function () { state.domain = select.value; applyFeatureFilter(); });
      }
      applyFeatureFilter();
    }
    if (state.tab === "files") {
      const search = WC.byId("file-search");
      if (search) {
        search.addEventListener("input", function () { state.fileQuery = search.value; applyFileFilter(); });
      }
      applyFileFilter();
    }
    if (state.tab === "decisions") {
      const search = WC.byId("decision-search");
      if (search) {
        search.addEventListener("input", function () { state.decisionQuery = search.value; applyDecisionFilter(); });
      }
      applyDecisionFilter();
    }
    review.sections = tabs().map(function (tab) { return { id: tab.id, label: tab.label }; });
    review.renderStatus();
  }

  function setTab(tab, updateHash) {
    state.tab = tab;
    if (updateHash !== false) {
      try { history.replaceState(null, "", "#" + tab); } catch (err) {}
    }
    render();
    const nav = document.querySelector(".wc-tabs");
    if (nav) nav.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------------------------------------------------------------- events */
  function bindEvents() {
    app.addEventListener("click", function (event) {
      const tab = event.target.closest("[data-tab]");
      if (tab) { setTab(tab.getAttribute("data-tab")); return; }
      const jump = event.target.closest("[data-jump-tab]");
      if (jump) { setTab(jump.getAttribute("data-jump-tab")); return; }
      const moduleNode = event.target.closest("[data-module]");
      if (moduleNode) { openModule(moduleNode.getAttribute("data-module")); return; }
      const featureNode = event.target.closest("[data-feature]");
      if (featureNode) { openFeature(featureNode.getAttribute("data-feature")); return; }
      const flow = event.target.closest("[data-flow]");
      if (flow) { state.flow = flow.getAttribute("data-flow"); render(); return; }
      const layer = event.target.closest("[data-layer]");
      if (layer) { state.layer = layer.getAttribute("data-layer"); render(); return; }
      const status = event.target.closest("[data-status]");
      if (status) { state.status = status.getAttribute("data-status"); render(); return; }
      const matrix = event.target.closest("[data-matrix]");
      if (matrix) {
        const parts = matrix.getAttribute("data-matrix").split("|");
        state.domain = parts[0];
        state.status = parts[1];
        setTab("features");
        return;
      }
      const graph = event.target.closest("[data-graph]");
      if (graph) { state.graph = graph.getAttribute("data-graph") === "1"; render(); return; }
      const drawerClose = event.target.closest("[data-close-drawer]");
      if (drawerClose) { closeDrawer(); return; }
      const copy = event.target.closest("[data-copy]");
      if (copy) { WC.copy(copy.getAttribute("data-copy")); return; }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeDrawer();
      const card = event.target.closest && event.target.closest(".module-card, .feature-card");
      if (card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        if (card.hasAttribute("data-module")) openModule(card.getAttribute("data-module"));
        else openFeature(card.getAttribute("data-feature"));
      }
    });
    const overlay = WC.byId("wc-overlay");
    if (overlay) overlay.addEventListener("click", closeDrawer);
    window.addEventListener("hashchange", function () {
      const tab = location.hash.replace("#", "");
      if (tabs().some(function (t) { return t.id === tab; })) setTab(tab, false);
    });
  }

  /* ---------------------------------------------------------------- boot */
  initChrome();
  review.bind();
  bindEvents();
  const initial = location.hash.replace("#", "");
  if (tabs().some(function (tab) { return tab.id === initial; })) state.tab = initial;
  try {
    const params = new URLSearchParams(location.search);
    if (params.get("graph") === "1") {
      state.tab = "modules";
      state.graph = true;
    }
  } catch (err) { /* ignore */ }
  render();
})();

  </script>
</body>
</html>
