<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Programmer Workflow {{WC_VERSION}}">
  <meta name="description" content="交互式设计原型：{{WC_PROJECT}}。可切换方向、视口、标注并导出评审。">
  <title>{{WC_TITLE}}</title>
  <style>
{{WC_STYLE}}
  </style>
</head>
<body data-page="prototype">
  <div class="proto-shell">
    <header class="proto-top">
      <div class="wc-brand">
        <div class="wc-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/><path d="M7 14h4"/><path d="M7 17h7"/>
          </svg>
        </div>
        <div>
          <h1 id="proto-title">{{WC_TITLE}}</h1>
          <p><span id="proto-project">{{WC_PROJECT}}</span> · 设计原型 · 生成于 <span id="proto-generated">{{WC_GENERATED}}</span> · <span class="wc-badge warn" style="vertical-align:1px">PROTOTYPE</span></p>
        </div>
      </div>
      <div class="wc-top-actions">
        <button class="wc-btn small ghost" id="wc-copy-brief" title="复制设计简报">
          <svg class="wc-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          复制简报
        </button>
        <button class="wc-btn small ghost" id="wc-print" title="打印当前界面">
          <svg class="wc-icon" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
          打印
        </button>
        <button class="wc-btn small icon ghost" id="wc-theme" title="切换明暗主题" aria-label="切换明暗主题">
          <svg class="wc-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <div class="proto-layout">
      <aside class="proto-rail">
        <section class="proto-panel" id="proto-brief"></section>
        <section class="proto-panel" id="proto-directions"></section>
        <section class="proto-panel" id="proto-screens"></section>
        <section class="proto-panel" id="proto-inspector"></section>
      </aside>

      <main class="proto-stage">
        <div class="proto-toolbar">
          <div class="segmented" id="proto-viewport" role="group" aria-label="视口">
            <button data-device="desktop" title="桌面">桌面</button>
            <button data-device="tablet" title="平板">平板</button>
            <button data-device="mobile" title="手机">手机</button>
          </div>
          <span class="wc-meta" id="proto-screen-meta"></span>
          <span class="spacer"></span>
          <button class="wc-btn small" id="proto-annotate" aria-pressed="false" title="在画布上点击添加标注">
            <svg class="wc-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            标注模式
          </button>
        </div>
        <div class="proto-canvas" id="proto-canvas">
          <div class="device" id="proto-device" data-device="desktop">
            <div class="device-chrome">
              <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
              <div class="device-url" id="proto-url">prototype.local</div>
            </div>
            <div class="device-screen" id="proto-screen"></div>
            <div class="pin-layer" id="proto-pins" aria-label="标注层"></div>
          </div>
        </div>
        <div class="proto-hint" id="proto-hint">切换到“标注模式”后，点击画布任意位置即可留言。</div>
      </main>
    </div>
  </div>

  <div class="wc-drawer-overlay" id="wc-overlay" hidden></div>
  <aside class="wc-drawer" id="wc-drawer" aria-hidden="true" aria-label="详情面板"></aside>
  <div class="wc-modal-wrap" id="wc-modal" role="dialog" aria-modal="true" aria-labelledby="wc-modal-title">
    <div class="wc-modal">
      <h3 id="wc-modal-title"></h3>
      <p id="wc-modal-desc"></p>
      <div id="wc-modal-body"></div>
      <div class="wc-modal-actions" id="wc-modal-actions"></div>
    </div>
  </div>
  <div class="wc-toast" id="wc-toast" role="status"></div>

  <div class="wc-reviewbar">
    <div class="wc-reviewbar-inner">
      <span class="status" id="wc-review-status">评审：<strong>未提交</strong></span>
      <span class="spacer"></span>
      <button class="wc-btn small" id="wc-review-note">添加意见</button>
      <button class="wc-btn small warn" id="wc-review-changes">请求修改</button>
      <button class="wc-btn small ok" id="wc-review-approve">通过</button>
      <button class="wc-btn small primary" id="wc-review-export">导出评审 JSON</button>
    </div>
  </div>

  <script id="wc-data" type="application/json">{{WC_DATA}}</script>
  <script>
{{WC_SCRIPT}}
  </script>
</body>
</html>
